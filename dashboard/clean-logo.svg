<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Deep obsidian backdrop -->
  <rect width="100%" height="100%" fill="#09090b"/>

  <!-- The Monolith AEGIS Mark: Exactly TWO solid geometric shapes forming an impenetrable shield + 'A' -->
  <g transform="translate(250, 195)">
    <!-- Left Wing / Pylon: Heavy solid angled chevron -->
    <path d="M 0 -110 
             L -85 -55 
             L -85 30 
             C -85 90, -45 135, 0 155
             L 0 85 
             C -30 70, -45 40, -45 15 
             L -45 -30 
             L 0 -60 Z" 
          fill="#f4f4f5"/>

    <!-- Right Wing / Pylon: Symmetrical interlocking chevron with negative space slit -->
    <path d="M 0 -110 
             L 85 -55 
             L 85 30 
             C 85 90, 45 135, 0 155
             L 0 85 
             C 30 70, 45 40, 45 15 
             L 45 -30 
             L 0 -60 Z" 
          fill="#f4f4f5"/>

    <!-- The Single Core Anchor: A solid, sharp emerald triangle in the heart of the negative space -->
    <polygon points="0,-15 22,25 -22,25" fill="#10b981"/>
  </g>

  <!-- Clean, Uncompromising Swiss Typography -->
  <text x="250" y="415" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Inter', 'Geist', sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="0.25em" 
        fill="#f4f4f5">AEGIS</text>

  <text x="250" y="445" 
        text-anchor="middle" 
        font-family="'Consolas', 'JetBrains Mono', monospace" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="0.2em" 
        fill="#52525b">FORMAL SOFTWARE IMMUNITY</text>
</svg>
