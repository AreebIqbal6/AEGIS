<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Sharp crisp linear gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Precise mathematical glow for the Q.E.D. node -->
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle ambient backdrop glow behind the shield -->
    <radialGradient id="ambientShieldGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.08)"/>
      <stop offset="100%" stop-color="rgba(9, 9, 11, 0)"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Canvas (#09090b) -->
  <rect width="100%" height="100%" fill="#09090b"/>

  <!-- Ambient Glow -->
  <circle cx="300" cy="220" r="180" fill="url(#ambientShieldGlow)"/>

  <!-- Main Logo Glyph (Centered at 300, 215) -->
  <g transform="translate(300, 215)">
    <!-- 1. Outer Monoline Shield Frame (Architectural Precision) -->
    <!-- Proportions: Width 220px, Height 270px -->
    <path d="M 0 -135
             L 110 -72
             L 110 35
             C 110 95, 60 145, 0 170
             C -60 145, -110 95, -110 35
             L -110 -72
             Z"
          fill="none"
          stroke="url(#shieldGrad)"
          stroke-width="12"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- 2. The Internal Monolithic 'A' Structure -->
    <!-- Left and Right Angled Struts meeting at apex -->
    <path d="M -60 85
             L 0 -85
             L 60 85"
          fill="none"
          stroke="#ffffff"
          stroke-width="12"
          stroke-linejoin="round"
          stroke-linecap="round"/>

    <!-- 3. Interlocking Horizontal Invariant Brace (Left & Right arms) -->
    <line x1="-48" y1="20" x2="-22" y2="20" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <line x1="22" y1="20" x2="48" y2="20" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <!-- 4. The Formal Invariant Verification Node (Emerald Q.E.D. Diamond) -->
    <!-- Mathematical symbol of proven correctness (Halmos / Q.E.D. Box) -->
    <polygon points="0,5 15,20 0,35 -15,20"
             fill="url(#emeraldGrad)"
             filter="url(#emeraldGlow)"/>
    <polygon points="0,8 12,20 0,32 -12,20"
             fill="#6ee7b7"/>

    <!-- 5. Vertical Anchor Axis Line (Subtle 2px hairline linking apex to core) -->
    <line x1="0" y1="-80" x2="0" y2="0" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="0" y1="40" x2="0" y2="135" stroke="rgba(16, 185, 129, 0.35)" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Typography Lockup -->
  <!-- Brand Wordmark: Clean, Heavy, Proportional Swiss Geometric Typography -->
  <text x="300" y="445"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', 'Inter', 'Geist', sans-serif"
        font-size="48"
        font-weight="800"
        letter-spacing="0.32em"
        fill="#f4f4f5">AEGIS</text>

  <!-- Subtitle: Developer Infrastructure Tagline in Monospace -->
  <text x="300" y="482"
        text-anchor="middle"
        font-family="'Consolas', 'JetBrains Mono', 'Courier New', monospace"
        font-size="12"
        font-weight="600"
        letter-spacing="0.22em"
        fill="#10b981">AUTONOMOUS SOFTWARE IMMUNITY</text>

  <!-- Subtle Verification Hash Footer -->
  <text x="300" y="525"
        text-anchor="middle"
        font-family="'Consolas', 'JetBrains Mono', monospace"
        font-size="9.5"
        letter-spacing="0.12em"
        fill="#52525b">FORMAL INVARIANT VERIFIER • Z3 SMT</text>
</svg>
