<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | AEGIS Kernel</title>
  <link rel="icon" type="image/png" href="logo-cutout.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; background-color: #0A0D14; }
    .mono { font-family: "JetBrains Mono", monospace; }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-6 selection:bg-cyan-500/30">
  <div class="max-w-md w-full text-center space-y-6">
    <div class="inline-flex p-4 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400">
      <img src="logo-cutout.png" alt="AEGIS" class="w-12 h-12 object-contain mx-auto" />
    </div>
    <div class="space-y-2">
      <div class="mono text-xs text-rose-400 font-semibold uppercase tracking-widest">HTTP 404 // State Unreachable</div>
      <h1 class="text-3xl font-bold tracking-tight text-white">Invariant Proof Failed</h1>
      <p class="text-slate-400 text-sm leading-relaxed">
        The requested path does not exist in the AEGIS AST traversal or routing index.
      </p>
    </div>
    <div class="pt-2 flex justify-center space-x-3">
      <a href="/" class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-sm transition-all shadow-lg shadow-cyan-500/20">
        Return to Dashboard
      </a>
      <a href="https://github.com/AreebIqbal6/AEGIS" target="_blank" rel="noopener noreferrer" class="px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-slate-200 border border-white/10 font-medium text-sm transition-all">
        GitHub Source
      </a>
    </div>
  </div>
</body>
</html>
