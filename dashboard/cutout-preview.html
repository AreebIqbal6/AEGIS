<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AEGIS — Cutout Logo Preview</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #09090b;
      color: #f4f4f5;
    }
    .card {
      margin-bottom: 30px;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #27272a;
      text-align: center;
    }
    .dark-bg { background: #09090b; }
    .zinc-bg { background: #18181b; }
    .light-bg { background: #ffffff; color: #09090b; }
    img { max-width: 480px; height: auto; }
    h3 { margin-top: 0; font-size: 14px; font-family: monospace; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <h2>AEGIS Cutout Logo Validation</h2>

  <div class="card dark-bg">
    <h3>ON DEEP OBSIDIAN CANVAS (#09090B)</h3>
    <img src="logo-cutout.png" alt="AEGIS Cutout on Dark">
  </div>

  <div class="card zinc-bg">
    <h3>ON ELEVATED ZINC PANEL (#18181B)</h3>
    <img src="logo-cutout.png" alt="AEGIS Cutout on Zinc">
  </div>

  <div class="card light-bg">
    <h3>ON LIGHT CANVAS (#FFFFFF)</h3>
    <img src="logo-cutout.png" alt="AEGIS Cutout on Light">
  </div>
</body>
</html>
